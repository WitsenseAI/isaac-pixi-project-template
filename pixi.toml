[workspace]
name = "isaac-pixi-project-template"
version = "0.1.0"
description = "Cross-platform Isaac Sim and Isaac Lab project template managed by pixi"
channels = ["conda-forge"]
platforms = [
  { name = "win-64-cuda", platform = "win-64", cuda = "12" },
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12", glibc = "2.35" },
]

[dependencies]
python = "3.12.*"

[pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]
index-strategy = "unsafe-best-match"
# isaaclab 3.0.0 requires urllib3>=2.8 but isaacsim-kernel 6.2.0.0 pins 2.7.0;
# unverified that isaaclab runs correctly on 2.7.0.
dependency-overrides = { urllib3 = "==2.7.0" }

[pypi-dependencies]
isaacsim = { version = "==6.2.0.0", extras = ["all", "extscache"] }
isaaclab = { version = "==3.0.0", extras = ["isaacsim"] }
torch = { version = "==2.11.*", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
# isaacsim-core 6.2.0.0 pins this pre-release; listing it here allows just this one.
tinyobjloader = "==2.0.0rc13"

[activation.env]
OMNI_KIT_ACCEPT_EULA = "YES"

[tasks]
check = "python scripts/check_install.py"
